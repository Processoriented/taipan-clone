name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
            path: |
              dist/*.dmg
              dist/*.zip
              dist/latest-mac.yml
              dist/*.blockmap
          - os: windows-latest
            artifact: win
            path: |
              dist/*.exe
              dist/latest.yml
              dist/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json version
        shell: bash
        run: node -e "const version=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME; if (tag!=='v'+version) { console.error('Tag '+tag+' does not match package version '+version); process.exit(1); }"
      - run: npm ci
      - name: Write the Apple notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build macOS
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run build:mac -- --publish never
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run build:win -- --publish never
      - name: Require updater metadata
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -f dist/latest-mac.yml
            test -n "$(find dist -name '*.zip' -print -quit)"
          else
            test -f dist/latest.yml
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.yml
            dist/**/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
