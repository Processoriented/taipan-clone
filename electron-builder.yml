appId: com.github.processoriented.taipan
productName: Taipan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/**'
  - '!.github/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Taipan
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  artifactName: Taipan-${version}-win-setup.${ext}
  shortcutName: Taipan!
  uninstallDisplayName: Taipan!
  createDesktopShortcut: always
mac:
  category: public.app-category.games
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch:
        - universal
dmg:
  artifactName: Taipan-${version}-mac.${ext}
linux:
  target:
    - AppImage
  category: Game
appImage:
  artifactName: Taipan-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: Processoriented
  repo: taipan-clone
  releaseType: release
